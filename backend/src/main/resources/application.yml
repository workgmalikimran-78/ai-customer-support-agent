server:
  port: 8080

spring:
  application:
    name: support-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/support_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  api-key: ${AI_SERVICE_API_KEY:}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

webhook:
  shared-secret: ${WEBHOOK_SHARED_SECRET:dev-webhook-secret-change-me}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app:
  security:
    # Set to true in any environment reachable outside localhost. When true, the app
    # refuses to start if jwt.secret / ai-service.api-key / webhook.shared-secret are
    # still unset, too short, or match a known placeholder value.
    require-strong-secrets: ${REQUIRE_STRONG_SECRETS:false}
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_RATE_LIMIT_LOCKOUT_MINUTES:15}

alerts:
  keyword: ${ALERTS_KEYWORD:refund}
  window-minutes: ${ALERTS_WINDOW_MINUTES:15}
  threshold: ${ALERTS_THRESHOLD:5}

analytics:
  aggregation:
    fixed-rate-ms: ${ANALYTICS_AGGREGATION_FIXED_RATE_MS:300000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.smartify.support: INFO
